<!--
Voxera - Single-file static website template (HTML/CSS/JS)
Purpose: a deployable static front-end that mimics an OTT layout (like Prime Video) with:
 - Hero carousel (featured banners, one highlighted)
 - Search bar
 - "Continue Watching" row (carousel)
 - "Explore" film grid
 - Sponsor logos footer
 - "Curator" / "Creators" tab with social links and messages
 - Embedded Gumroad player placeholder (replace PRODUCT_ID)

How to use:
 1. Save this file as index.html
 2. Replace placeholder thumbnails and cover images with your assets (in /assets/ or direct URLs).
 3. For each film, upload to Gumroad and copy the product link.
    Replace `GUMROAD_PRODUCT_ID` in film objects (in the `films` array) with your actual product slugs.
    Format of embed: https://gumroad.com/l/PRODUCT_ID?wanted=true
 4. Deploy to GitHub Pages / Netlify / Vercel (static site deploy).
 5. Sponsors: replace the sponsor image srcs in the `sponsors` array or in the footer area.

Notes:
 - This is a simple, dependency-free template (no external libs) so it runs offline.
 - Player is embedded in a modal; user never leaves yourdomain.
 - You can change autoplay behavior, styling, or add analytics as needed.
 - When you want me to add production polish (better accessibility, analytics, ad placeholders, serverless forms), say so.
--><!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voxera — Streaming</title>
  <style>
    :root{--bg:#071021;--card:#0b1b2b;--muted:#9fb0c4;--accent:#00bfa6;--glass: rgba(255,255,255,0.03)}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;background:linear-gradient(180deg,#04101a 0%, #071021 100%);color:#e6f0f6}
    header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid rgba(255,255,255,0.03);position:sticky;top:0;background:linear-gradient(180deg, rgba(7,16,33,0.85), rgba(7,16,33,0.65));backdrop-filter: blur(6px);z-index:50}
    .logo{display:flex;align-items:center;gap:12px}
    .logo .mark{width:42px;height:42px;background:linear-gradient(135deg,var(--accent),#2fd6c1);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#042529}
    .nav{display:flex;align-items:center;gap:14px}
    .search{display:flex;align-items:center;background:var(--glass);padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.02)}
    .search input{background:transparent;border:none;outline:none;color:var(--muted);width:260px}
    .main{padding:20px 28px}/* Hero carousel */
.hero{position:relative;margin-bottom:20px}
.hero-track{display:flex;gap:14px;overflow:hidden;padding:14px}
.hero-card{min-width:56%;border-radius:12px;background:linear-gradient(90deg, rgba(0,0,0,0.35), rgba(0,0,0,0.25));padding:20px;position:relative}
.hero-card .meta{position:absolute;left:26px;bottom:26px}
.hero-card h2{margin:0 0 6px;font-size:22px}
.hero-thumbs{display:flex;gap:12px;margin-top:12px;align-items:center}
.thumb-small{width:120px;height:68px;border-radius:8px;background:#0f2433;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.hero-controls{position:absolute;right:18px;top:34%;display:flex;flex-direction:column;gap:8px}
.btn{background:var(--accent);color:#042529;padding:8px 12px;border-radius:8px;border:none;cursor:pointer}

/* Rows */
.row{margin:18px 0}
.row h3{margin:6px 0;color:#cfe8f2}
.carousel{display:flex;gap:12px;overflow:auto;padding:6px 0}
.card{min-width:180px;background:var(--card);border-radius:8px;padding:10px}
.poster{width:100%;height:110px;border-radius:6px;background:#0f2433;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.card h4{margin:8px 0 4px;font-size:15px}
.watch-btn{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:6px 8px;border-radius:6px;color:var(--muted);cursor:pointer}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}

footer{padding:16px 28px;border-top:1px solid rgba(255,255,255,0.03);display:flex;justify-content:space-between;align-items:center}
.sponsors{display:flex;gap:12px;align-items:center}
.sponsors img{height:28px;filter:grayscale(1) opacity(.9)}

/* modal player */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,6,10,0.6);z-index:100}
.modal .box{width:90%;max-width:980px;background:#001021;border-radius:10px;padding:14px}
.modal .close{float:right;background:transparent;border:0;color:#9fb0c4;font-size:18px}
.player-frame{width:100%;height:540px;border-radius:8px;border:0}

/* curator */
.curator{background: linear-gradient(180deg,#05202b, #04121a);padding:18px;border-radius:8px;border:1px solid rgba(255,255,255,0.02)}
.curator .socials{display:flex;gap:8px;margin-top:8px}
.socials a{padding:8px 10px;background:var(--glass);border-radius:8px;color:var(--muted);text-decoration:none}

/* responsive */
@media (max-width:800px){
  .hero-card{min-width:100%}
  .player-frame{height:320px}
}

  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="mark">V</div>
      <div>
        <div style="font-weight:700">Voxera</div>
        <div style="font-size:12px;color:var(--muted)">Independent Cinema</div>
      </div>
    </div><div class="nav">
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="margin-right:8px"><path d="M21 21l-4.35-4.35" stroke="#bcd6e5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="11" r="6" stroke="#bcd6e5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <input id="searchInput" placeholder="Search films, creators, tags..." />
  </div>
  <nav style="display:flex;gap:10px;align-items:center">
    <a href="#home" class="nav-link" style="color:var(--muted);text-decoration:none">Home</a>
    <a href="#curator" id="curatorLink" style="color:var(--muted);text-decoration:none">Curator</a>
  </nav>
</div>

  </header>  <main class="main" id="home"><!-- HERO -->
<section class="hero">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <h2 style="margin:0">Featured</h2>
    <div style="color:var(--muted);font-size:13px">Swipe to explore featured films</div>
  </div>

  <div class="hero-track" id="heroTrack">
    <!-- JS will populate hero cards -->
  </div>

  <div style="display:flex;justify-content:flex-end;margin-top:8px">
    <div class="hero-controls">
      <button id="heroPrev" class="watch-btn">◀</button>
      <button id="heroNext" class="watch-btn">▶</button>
    </div>
  </div>
</section>

<!-- Continue Watching -->
<section class="row">
  <h3>Continue Watching</h3>
  <div class="carousel" id="continueCarousel">
    <!-- JS fills -->
  </div>
</section>

<!-- Explore -->
<section class="row">
  <h3>Explore</h3>
  <div class="grid" id="exploreGrid">
    <!-- JS fills -->
  </div>
</section>

<!-- Curator / Creator tab (togglable) -->
<section style="margin-top:26px">
  <div class="curator" id="curatorPanel" style="display:none">
    <h3>From the Curator</h3>
    <p id="curatorMessage">Welcome — this is where you publish notes, short films, and messages to the audience.</p>
    <div class="socials" id="socialLinks">
      <!-- Social links populate here -->
    </div>
  </div>
</section>

  </main>  <footer>
    <div style="display:flex;align-items:center;gap:14px">
      <div style="font-size:13px;color:var(--muted)">© Voxera</div>
      <div style="font-size:12px;color:var(--muted)">Built with lean infrastructure</div>
    </div>
    <div class="sponsors" id="sponsorFooter">
      <!-- Sponsor logos populate here -->
    </div>
  </footer>  <!-- Modal Player (embedded Gumroad iframe here) -->  <div class="modal" id="playerModal">
    <div class="box">
      <button class="close" id="closeModal">✕</button>
      <div id="playerMeta" style="color:var(--muted);margin-bottom:8px"></div>
      <iframe id="playerFrame" class="player-frame" src="" frameborder="0" allowfullscreen></iframe>
    </div>
  </div>  <script>
    // --- Simple dataset (replace these with your uploads) ---
    const films = [
      {id: 'film1', title: 'What Happens After Death', year: 2025, gumroad: 'GUMROAD_PRODUCT_ID_1', thumb: '', desc: 'A modern Nachiketa retelling.'},
      {id: 'film2', title: 'Public Domain: Classic 1', year: 1934, gumroad: 'GUMROAD_PRODUCT_ID_2', thumb: ''},
      {id: 'film3', title: 'Public Domain: Classic 2', year: 1928, gumroad: 'GUMROAD_PRODUCT_ID_3', thumb: ''},
      {id: 'film4', title: 'Indie Short: Midnight', year: 2024, gumroad: 'GUMROAD_PRODUCT_ID_4', thumb: ''},
      {id: 'film5', title: 'Documentary: River', year: 2019, gumroad: 'GUMROAD_PRODUCT_ID_5', thumb: ''}
    ];

    const sponsors = [
      {name:'Sponsor A', img:''}, {name:'Sponsor B', img:''}, {name:'Sponsor C', img:''}, {name:'Sponsor D', img:''}
    ];

    const socials = [
      {name:'Instagram', href:'https://instagram.com/yourhandle'},
      {name:'Twitter', href:'https://twitter.com/yourhandle'},
      {name:'YouTube', href:'https://youtube.com/yourchannel'}
    ];

    // --- Helpers to render UI ---
    const heroTrack = document.getElementById('heroTrack');
    const continueCarousel = document.getElementById('continueCarousel');
    const exploreGrid = document.getElementById('exploreGrid');
    const sponsorFooter = document.getElementById('sponsorFooter');
    const curatorPanel = document.getElementById('curatorPanel');
    const socialLinks = document.getElementById('socialLinks');
    const playerModal = document.getElementById('playerModal');
    const playerFrame = document.getElementById('playerFrame');
    const playerMeta = document.getElementById('playerMeta');

    // Utility: a neutral placeholder poster element
    function createPosterElem(text){
      const d = document.createElement('div');
      d.className = 'poster';
      d.textContent = text;
      return d;
    }

    // Render hero (first film highlighted with larger card + small thumbs)
    function renderHero(){
      heroTrack.innerHTML = '';
      const main = films[0];
      const heroCard = document.createElement('div');
      heroCard.className = 'hero-card';
      heroCard.innerHTML = `<h2>${main.title}</h2><p style="color:var(--muted)">${main.desc}</p><div class=\"meta\"><button class=\"btn\" data-id=\"${main.id}\">Watch Now</button></div>`;
      heroTrack.appendChild(heroCard);

      const thumbs = document.createElement('div');
      thumbs.className = 'hero-thumbs';
      films.slice(1).forEach(f => {
        const t = document.createElement('div');
        t.className = 'thumb-small';
        t.textContent = f.title;
        t.style.cursor = 'pointer';
        t.onclick = () => openFilm(f.id);
        thumbs.appendChild(t);
      });
      heroCard.appendChild(thumbs);
    }

    function renderRows(){
      continueCarousel.innerHTML=''; exploreGrid.innerHTML='';
      // Continue watching - demo uses first two films
      films.slice(0,3).forEach(f => {
        const c = document.createElement('div'); c.className='card';
        const poster = createPosterElem(f.title); c.appendChild(poster);
        const h = document.createElement('h4'); h.textContent = f.title; c.appendChild(h);
        const w = document.createElement('button'); w.className='watch-btn'; w.textContent='Watch'; w.onclick = ()=> openFilm(f.id); c.appendChild(w);
        continueCarousel.appendChild(c);
      });

      // Explore grid
      films.forEach(f =>{
        const card = document.createElement('div'); card.className='card';
        card.innerHTML = ''; card.appendChild(createPosterElem(f.title));
        const h = document.createElement('h4'); h.textContent = f.title; card.appendChild(h);
        const desc = document.createElement('div'); desc.style.color='var(--muted)'; desc.style.fontSize='13px'; desc.textContent = `${f.year}`; card.appendChild(desc);
        const btn = document.createElement('button'); btn.className='watch-btn'; btn.textContent='Watch'; btn.onclick = ()=> openFilm(f.id); card.appendChild(btn);
        exploreGrid.appendChild(card);
      });
    }

    function renderSponsors(){
      sponsorFooter.innerHTML='';
      sponsors.forEach(s =>{
        const img = document.createElement('img');
        img.src = s.img || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="40"><rect width="100%" height="100%" fill="%230b2433"/><text x="12" y="24" fill="%2389aabf" font-size="12">'+encodeURIComponent(s.name)+'</text></svg>';
        img.alt = s.name; sponsorFooter.appendChild(img);
      })
    }

    function renderSocials(){
      socialLinks.innerHTML='';
      socials.forEach(s=>{
        const a = document.createElement('a'); a.href = s.href; a.target='_blank'; a.textContent = s.name; socialLinks.appendChild(a);
      })
    }

    function openFilm(id){
      const f = films.find(x=>x.id===id);
      if(!f) return;
      // Build gumroad embed URL — replace PRODUCT_ID placeholder in films[] with your real product slug
      const src = `https://gumroad.com/l/${f.gumroad}?wanted=true`;
      playerFrame.src = src;
      playerMeta.textContent = `${f.title} (${f.year})`;
      playerModal.style.display = 'flex';
    }

    document.getElementById('closeModal').onclick = ()=>{
      playerModal.style.display='none';
      playerFrame.src = '';
    }

    // Hero navigation
    document.getElementById('heroNext').onclick = ()=>{
      // rotate films array and re-render
      films.push(films.shift()); renderHero(); renderRows();
    }
    document.getElementById('heroPrev').onclick = ()=>{
      films.unshift(films.pop()); renderHero(); renderRows();
    }

    // Search
    document.getElementById('searchInput').addEventListener('input', (e)=>{
      const q = e.target.value.trim().toLowerCase();
      if(!q){ renderRows(); return; }
      const filtered = films.filter(f=> f.title.toLowerCase().includes(q) || (f.desc||'').toLowerCase().includes(q));
      exploreGrid.innerHTML=''; filtered.forEach(f=>{
        const card = document.createElement('div'); card.className='card'; card.appendChild(createPosterElem(f.title));
        const h = document.createElement('h4'); h.textContent = f.title; card.appendChild(h);
        const btn = document.createElement('button'); btn.className='watch-btn'; btn.textContent='Watch'; btn.onclick = ()=> openFilm(f.id); card.appendChild(btn);
        exploreGrid.appendChild(card);
      });
    });

    // Curator toggle
    document.getElementById('curatorLink').addEventListener('click', (e)=>{
      e.preventDefault();
      const is = curatorPanel.style.display === 'block';
      curatorPanel.style.display = is ? 'none' : 'block';
      if(!is) curatorPanel.scrollIntoView({behavior:'smooth'});
    });

    // Initial render
    renderHero(); renderRows(); renderSponsors(); renderSocials();

    // Accessibility: close modal on Escape
    document.addEventListener('keydown', (e)=>{ if(e.key==='Escape'){ playerModal.style.display='none'; playerFrame.src=''; } });
  </script></body>
</html>
