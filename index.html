<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Voxera — Indie Streaming</title>
<style>
:root{--bg:#071021;--card:#0b1b2b;--muted:#9fb0c4;--accent:#00bfa6;--glass: rgba(255,255,255,0.03)}
*{box-sizing:border-box}
body{margin:0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;background:linear-gradient(180deg,#04101a 0%, #071021 100%);color:#e6f0f6}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid rgba(255,255,255,0.03);position:sticky;top:0;background:linear-gradient(180deg, rgba(7,16,33,0.85), rgba(7,16,33,0.65));backdrop-filter: blur(6px);z-index:50}
.logo{display:flex;align-items:center;gap:12px}
.logo .mark{width:44px;height:44px;background:linear-gradient(135deg,var(--accent),#2fd6c1);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#042529}
.search{display:flex;align-items:center;background:var(--glass);padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.02)}
.search input{background:transparent;border:none;outline:none;color:var(--muted);width:240px}
.main{padding:18px 22px;max-width:1200px;margin:0 auto}

/* Hero */
.hero{position:relative;margin-bottom:18px}
.hero-track{display:flex;gap:14px;overflow:hidden;padding:14px}
.hero-card{min-width:60%;border-radius:12px;background:linear-gradient(90deg, rgba(0,0,0,0.35), rgba(0,0,0,0.25));padding:20px;position:relative}
.hero-card h2{margin:0 0 6px;font-size:22px}
.hero-thumbs{display:flex;gap:12px;margin-top:12px;align-items:center}
.thumb-small{width:120px;height:68px;border-radius:8px;background:#0f2433;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.hero-controls{position:absolute;right:18px;top:40%;display:flex;flex-direction:column;gap:8px}

/* Rows */
.row{margin:16px 0}
.row h3{margin:6px 0;color:#cfe8f2}
.carousel{display:flex;gap:12px;overflow:auto;padding:6px 0}
.card{min-width:180px;background:var(--card);border-radius:8px;padding:10px}
.poster{width:100%;height:110px;border-radius:6px;background:#0f2433;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.card h4{margin:8px 0 4px;font-size:15px}
.watch-btn{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:6px 8px;border-radius:6px;color:var(--muted);cursor:pointer}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}

footer{padding:16px 22px;border-top:1px solid rgba(255,255,255,0.03);display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:0 auto}
.sponsors{display:flex;gap:12px;align-items:center}
.sponsors img{height:28px;filter:grayscale(1) opacity(.9)}

/* modal player */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,6,10,0.6);z-index:100}
.modal .box{width:92%;max-width:980px;background:#001021;border-radius:10px;padding:14px}
.modal .close{float:right;background:transparent;border:0;color:#9fb0c4;font-size:18px}
.player-frame{width:100%;height:540px;border-radius:8px;border:0}

/* curator */
.curator{background: linear-gradient(180deg,#05202b, #04121a);padding:18px;border-radius:8px;border:1px solid rgba(255,255,255,0.02)}
.curator .socials{display:flex;gap:8px;margin-top:8px}
.socials a{padding:8px 10px;background:var(--glass);border-radius:8px;color:var(--muted);text-decoration:none}

/* responsive */
@media (max-width:900px){
  .hero-card{min-width:100%}
  .player-frame{height:320px}
  .search input{width:120px}
}
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="mark">V</div>
    <div>
      <div style="font-weight:700">Voxera</div>
      <div style="font-size:12px;color:var(--muted)">Independent Cinema</div>
    </div>
  </div>

  <div style="display:flex;gap:12px;align-items:center">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="margin-right:8px"><path d="M21 21l-4.35-4.35" stroke="#bcd6e5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="11" r="6" stroke="#bcd6e5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <input id="searchInput" placeholder="Search films, creators, tags..." />
    </div>
    <a id="curatorLink" href="#" style="color:var(--muted);text-decoration:none">Curator</a>
  </div>
</header>

<main class="main" id="home">
  <section class="hero">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <h2 style="margin:0">Featured</h2>
      <div style="color:var(--muted);font-size:13px">Swipe to explore featured films</div>
    </div>

    <div class="hero-track" id="heroTrack"></div>
    <div style="display:flex;justify-content:flex-end;margin-top:8px">
      <div class="hero-controls">
        <button id="heroPrev" class="watch-btn">◀</button>
        <button id="heroNext" class="watch-btn">▶</button>
      </div>
    </div>
  </section>

  <section class="row">
    <h3>Continue Watching</h3>
    <div class="carousel" id="continueCarousel"></div>
  </section>

  <section class="row">
    <h3>Explore</h3>
    <div class="grid" id="exploreGrid"></div>
  </section>

  <section style="margin-top:22px">
    <div class="curator" id="curatorPanel" style="display:none">
      <h3>From the Curator</h3>
      <p id="curatorMessage">Welcome — this is where you publish notes, short films, and messages to the audience.</p>
      <div class="socials" id="socialLinks"></div>
    </div>
  </section>
</main>

<footer>
  <div style="display:flex;align-items:center;gap:14px">
    <div style="font-size:13px;color:var(--muted)">© Voxera</div>
    <div style="font-size:12px;color:var(--muted)">Built with lean infrastructure</div>
  </div>
  <div class="sponsors" id="sponsorFooter"></div>
</footer>

<div class="modal" id="playerModal">
  <div class="box">
    <button class="close" id="closeModal">✕</button>
    <div id="playerMeta" style="color:var(--muted);margin-bottom:8px"></div>
    <iframe id="playerFrame" class="player-frame" src="" frameborder="0" allowfullscreen></iframe>
  </div>
</div>

<script>
// --- Replace these film objects with your Gumroad product slugs and thumbnail URLs ---
// gumroad: product slug only (the part after gumroad.com/l/)
// thumb: a publicly accessible image URL (you can upload images to GitHub and use raw.githubusercontent links)
// Example: gumroad: 'abc123', thumb: 'https://raw.githubusercontent.com/USERNAME/REPO/main/assets/thumb1.png'
const films = [
  {id:'film1', title:'Your Film Title 1', year:2025, gumroad:'REPLACE_GUMROAD_SLUG_1', thumb:'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22240%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%230b2433%22/><text x=%2210%22 y=%22130%22 font-family=%22Arial%22 font-size=%2216%22 fill=%23a8c2d7%3EYour+Thumbnail</text></svg>'},
  {id:'film2', title:'Public Domain: Classic 1', year:1934, gumroad:'REPLACE_GUMROAD_SLUG_2', thumb:'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22240%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%230b2433%22/></svg>'},
  {id:'film3', title:'Public Domain: Classic 2', year:1928, gumroad:'REPLACE_GUMROAD_SLUG_3', thumb:'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22240%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%230b2433%22/></svg>'}
];

// Sponsors (replace img with real links later)
const sponsors = [
  {name:'Brand A', img:'https://via.placeholder.com/120x28?text=Brand+A'},
  {name:'Brand B', img:'https://via.placeholder.com/120x28?text=Brand+B'},
  {name:'Brand C', img:'https://via.placeholder.com/120x28?text=Brand+C'}
];

const socials = [
  {name:'Instagram', href:'https://instagram.com/yourhandle'},
  {name:'YouTube', href:'https://youtube.com/yourchannel'}
];

const heroTrack = document.getElementById('heroTrack');
const continueCarousel = document.getElementById('continueCarousel');
const exploreGrid = document.getElementById('exploreGrid');
const sponsorFooter = document.getElementById('sponsorFooter');
const curatorPanel = document.getElementById('curatorPanel');
const socialLinks = document.getElementById('socialLinks');
const playerModal = document.getElementById('playerModal');
const playerFrame = document.getElementById('playerFrame');
const playerMeta = document.getElementById('playerMeta');

function createPoster(src, title){
  const img = document.createElement('img');
  img.src = src;
  img.alt = title;
  img.style.width='100%';
  img.style.height='110px';
  img.style.objectFit='cover';
  img.style.borderRadius='6px';
  return img;
}

// Render hero (first film highlighted)
function renderHero(){
  heroTrack.innerHTML='';
  const main = films[0];
  const heroCard = document.createElement('div');
  heroCard.className='hero-card';
  heroCard.innerHTML = `<h2>${main.title}</h2><p style="color:var(--muted)">${main.year}</p><div class="meta"><button class="watch-btn" data-id="${main.id}">Watch Now</button></div>`;
  heroTrack.appendChild(heroCard);

  const thumbs = document.createElement('div');
  thumbs.className='hero-thumbs';
  films.slice(1).forEach(f=>{
    const t = document.createElement('div');
    t.className='thumb-small';
    t.textContent = f.title;
    t.style.cursor='pointer';
    t.onclick=()=>openFilm(f.id);
    thumbs.appendChild(t);
  });
  heroCard.appendChild(thumbs);
}

function renderRows(){
  continueCarousel.innerHTML=''; exploreGrid.innerHTML='';
  films.slice(0,3).forEach(f=>{
    const c = document.createElement('div'); c.className='card';
    c.appendChild(createPoster(f.thumb, f.title));
    const h = document.createElement('h4'); h.textContent=f.title; c.appendChild(h);
    const w = document.createElement('button'); w.className='watch-btn'; w.textContent='Watch'; w.onclick=()=>openFilm(f.id); c.appendChild(w);
    continueCarousel.appendChild(c);
  });

  films.forEach(f=>{
    const card = document.createElement('div'); card.className='card';
    card.appendChild(createPoster(f.thumb, f.title));
    const h = document.createElement('h4'); h.textContent=f.title; card.appendChild(h);
    const desc = document.createElement('div'); desc.style.color='var(--muted)'; desc.style.fontSize='13px'; desc.textContent = `${f.year}`; card.appendChild(desc);
    const btn = document.createElement('button'); btn.className='watch-btn'; btn.textContent='Watch'; btn.onclick=()=>openFilm(f.id); card.appendChild(btn);
    exploreGrid.appendChild(card);
  });
}

function renderSponsors(){
  sponsorFooter.innerHTML='';
  sponsors.forEach(s=>{
    const img = document.createElement('img');
    img.src = s.img;
    img.alt = s.name;
    sponsorFooter.appendChild(img);
  });
}

function renderSocials(){
  socialLinks.innerHTML='';
  socials.forEach(s=>{
    const a=document.createElement('a'); a.href=s.href; a.target='_blank'; a.textContent=s.name; socialLinks.appendChild(a);
  });
}

function openFilm(id){
  const f = films.find(x=>x.id===id);
  if(!f) return alert('Film not configured yet.');
  if(!f.gumroad || f.gumroad.startsWith('REPLACE')) return alert('Insert Gumroad product slug in the films array for this title to enable streaming.');
  const src = `https://gumroad.com/l/${f.gumroad}?wanted=true`;
  playerFrame.src = src;
  playerMeta.textContent = `${f.title} (${f.year})`;
  playerModal.style.display='flex';
}

document.getElementById('closeModal').onclick=()=>{
  playerModal.style.display='none';
  playerFrame.src='';
};

document.getElementById('heroNext').onclick=()=>{
  films.push(films.shift()); renderHero(); renderRows();
};
document.getElementById('heroPrev').onclick=()=>{
  films.unshift(films.pop()); renderHero(); renderRows();
};

document.getElementById('searchInput').addEventListener('input',(e)=>{
  const q = e.target.value.trim().toLowerCase();
  if(!q){ renderRows(); return; }
  const filtered = films.filter(f=> f.title.toLowerCase().includes(q) || (f.desc||'').toLowerCase().includes(q));
  exploreGrid.innerHTML=''; filtered.forEach(f=>{
    const card=document.createElement('div'); card.className='card';
    card.appendChild(createPoster(f.thumb,f.title));
    const h=document.createElement('h4'); h.textContent=f.title; card.appendChild(h);
    const btn=document.createElement('button'); btn.className='watch-btn'; btn.textContent='Watch'; btn.onclick=()=>openFilm(f.id); card.appendChild(btn);
    exploreGrid.appendChild(card);
  });
});

document.getElementById('curatorLink').addEventListener('click',(e)=>{
  e.preventDefault();
  const is = curatorPanel.style.display === 'block';
  curatorPanel.style.display = is ? 'none' : 'block';
  if(!is) curatorPanel.scrollIntoView({behavior:'smooth'});
});

renderHero(); renderRows(); renderSponsors(); renderSocials();
</script>
</body>
</html>
