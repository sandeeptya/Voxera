<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Film — Voxera</title>
<style>
body{margin:0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;background:#071021;color:#e6f0f6}
.container{max-width:1000px;margin:26px auto;padding:18px}
.poster{width:100%;height:420px;background:#0f2433;border-radius:8px;display:flex;align-items:center;justify-content:center}
.watch{margin-top:12px;padding:10px 14px;border-radius:8px;background:#00bfa6;color:#042529;border:none;cursor:pointer}
</style>
</head>
<body>
<div class="container">
  <h1 id="title">Film Title</h1>
  <div class="poster" id="poster">Poster</div>
  <p id="desc" style="color:#9fb0c4">Short description about the film will appear here.</p>
  <button class="watch" id="watchBtn">Watch Now</button>
</div>
<script>
document.getElementById('watchBtn').addEventListener('click', function(){
  // Replace GUMROAD_SLUG with your product slug
  const slug = 'GUMROAD_SLUG';
  if(slug.startsWith('GUMROAD')) return alert('Replace slug in film template.');
  const src = `https://gumroad.com/l/${slug}?wanted=true`;
  // Open modal-style player in a new tab or embed — for simplicity open new tab
  window.open(src, '_blank');
});
</script>
</body>
</html>
